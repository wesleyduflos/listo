<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Listo — Capture rapide</title>
<style>
@font-face{font-family:Geist;src:url(../fonts/Geist-Variable.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:'Geist Mono';src:url(../fonts/GeistMono-Variable.woff2) format("woff2");font-weight:100 900}
html,body{background:#d9dbd5}body{display:flex;justify-content:center;padding:0}

body{margin:0}
a{color:#2443D1}a:hover{color:#1A33A6}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.meta{font-size:12px;color:#5B606B}
.tok{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:7px 10px;border-radius:8px;background:#E3E8FB;color:#1A33A6;border:0;font-family:inherit}
.opt{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #E6E8E3;font-size:15px;color:#15171C;text-decoration:none}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F2F3EF;font-family:Geist,system-ui,sans-serif;color:#15171C;position:relative;overflow:hidden">

  <div aria-hidden="true" style="padding:56px 20px;display:flex;flex-direction:column;gap:10px;opacity:.35">
    <div style="font-size:30px;font-weight:700">Aujourd'hui</div>
    <div style="height:4px;background:#DDE0DA;border-radius:2px"></div>
    <div style="height:56px;background:#fff;border-radius:10px"></div>
    <div style="height:44px;background:#fff;border-radius:10px"></div>
    <div style="height:44px;background:#fff;border-radius:10px"></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(21,23,28,.45)"></div>

  <section role="dialog" aria-label="Nouvelle tâche" style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:10px 20px 30px;display:flex;flex-direction:column;gap:16px">
    <div style="width:40px;height:4px;border-radius:2px;background:#DDE0DA;align-self:center"></div>

    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="cap" class="meta">Nouvelle tâche</label>
      <input id="cap" value="coiffeur samedi p2 15min" style="border:0;outline:0;font:inherit;font-size:22px;font-weight:600;padding:0;color:#15171C">
      <div class="meta">Compris comme :</div>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <button class="tok">Prendre RDV coiffeur</button>
      <button class="tok"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="1.5" y="2.5" width="11" height="10" rx="2" fill="none" stroke="#1A33A6" stroke-width="1.4"></rect><path d="M1.5 5.5h11M4.5 1v3M9.5 1v3" stroke="#1A33A6" stroke-width="1.4" stroke-linecap="round"></path></svg>Sam. 25 oct · stricte</button>
      <button class="tok" style="background:#DDE0DA;color:#15171C"><span class="mono">P2</span></button>
      <button class="tok"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="#1A33A6" stroke-width="1.4"></circle><path d="M7 4v3l2 1.5" fill="none" stroke="#1A33A6" stroke-width="1.4" stroke-linecap="round"></path></svg><span class="mono">15 min</span></button>
      <button class="tok" style="background:#fff;border:1px solid #B9BDB5;color:#4A4F58">Horizon : semaine</button>
    </div>

    <div style="display:flex;flex-direction:column">
      <a href="#" class="opt"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 5h10M4 9h10M4 13h6" stroke="#5B606B" stroke-width="1.6" stroke-linecap="round"></path></svg><span style="flex:1">Sous-tâches ou liste</span><span class="meta">Aucune</span></a>
      <a href="#" class="opt"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9a6 6 0 0 1 10.5-4M15 9a6 6 0 0 1-10.5 4" fill="none" stroke="#5B606B" stroke-width="1.6" stroke-linecap="round"></path><path d="M13.5 2v3h-3M4.5 16v-3h3" fill="none" stroke="#5B606B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="flex:1">Récurrence</span><span class="meta">~ toutes les 5–6 sem.</span></a>
      <a href="#" class="opt"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="3" width="12" height="12" rx="3" fill="none" stroke="#5B606B" stroke-width="1.6"></rect><path d="M6.5 9l2 2 3-4" fill="none" stroke="#5B606B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="flex:1">Rattacher à une préparation</span><span class="meta">—</span></a>
    </div>

    <button style="font:inherit;font-size:16px;font-weight:600;border:0;border-radius:14px;padding:16px;background:#2443D1;color:#fff">Ajouter</button>
  </section>
</div>
</body>
</html>
